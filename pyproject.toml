[project]
name = "jev-vs-kev"
version = "0.1.0"
description = "Side-by-side support-ticket triage benchmark of two OpenRouter models (JEV vs KEV)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.157.0",
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
